[project]
name = "survival-test"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "dash>=4.5.0",
    "dash-bootstrap-components>=2.0.4",
    "fastapi>=0.165.0",
    "jupyter>=1.1.1",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "watchdog>=7.1.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "nbqa[toolchain]>=1.10.0",
    "ruff>=0.17.5",
]
